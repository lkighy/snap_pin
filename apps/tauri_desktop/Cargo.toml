[package]
name = "tauri_desktop"
version.workspace = true
edition.workspace = true
publish = false

[dependencies]
ab_glyph = "0.2"
core_service.workspace = true
image = { version = "0.25", default-features = false, features = ["bmp", "gif", "jpeg", "png", "webp"] }
imageproc = "0.25"
ipc.workspace = true
log.workspace = true
model_registry.workspace = true
platform_win32.workspace = true
serde = { version = "1", features = ["derive"] }
serde_json = "1"
shared_models.workspace = true
tauri = { version = "2", features = ["tray-icon"] }

[build-dependencies]
tauri-build = { version = "2" }

[features]
default = []
local-ocr-rs = ["core_service/local-ocr-rs"]
local-translate-ct2 = ["core_service/local-translate-ct2"]
