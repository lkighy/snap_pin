[workspace]
members = [
    "apps/tauri_desktop",
    "apps/egui_overlay",
    "crates/core_service",
    "crates/model_registry",
    "crates/ocr_engine",
    "crates/perf_trace",
    "crates/platform_api",
    "crates/platform_runtime",
    "crates/platform_win32",
    "crates/ipc",
    "crates/shared_models",
    "crates/translate_engine"
]
resolver = "3"

[workspace.package]
version = "0.1.0"
edition = "2024"
license = "MIT OR Apache-2.0"
authors = ["snap_pin contributors"]

[workspace.dependencies]
core_service = { path = "crates/core_service" }
ipc = { path = "crates/ipc" }
log = "0.4"
model_registry = { path = "crates/model_registry" }
ocr_engine = { path = "crates/ocr_engine" }
perf_trace = { path = "crates/perf_trace" }
platform_api = { path = "crates/platform_api" }
platform_runtime = { path = "crates/platform_runtime" }
platform_win32 = { path = "crates/platform_win32" }
shared_models = { path = "crates/shared_models" }
translate_engine = { path = "crates/translate_engine" }

[patch.crates-io]
ocr-rs = { path = "third_party/ocr-rs-2.2.2" }
